[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "socialscrape-sdk"
version = "0.1.1"
description = "SocialScrape API client: social media data (profiles, posts, comments, search, ads, transcripts) in one response shape."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["socialscrape", "social media", "api", "tiktok", "instagram", "youtube", "transcripts"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.27,<1"]

[project.urls]
Homepage = "https://socialscrape.dev"
Documentation = "https://socialscrape.dev/docs"
Repository = "https://github.com/SocialScraper/socialscrape-python"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
socialscrape = ["py.typed"]
